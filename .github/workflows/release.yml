name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated release tag to complete
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - name: Verify the tag and package versions
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: node scripts/release.mjs check "$RELEASE_TAG"
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: just check
      - name: Pack the checked source
        run: node scripts/release.mjs pack "$RUNNER_TEMP/release"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-release
          path: ${{ runner.temp }}/release/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.16.0 --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-release
          path: ${{ runner.temp }}/release/
      - name: Publish and verify both packages
        run: node scripts/release.mjs publish "$RUNNER_TEMP/release"
      - name: Publish the release receipt and exact archives
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/existing-release"
            cmp "$RUNNER_TEMP/release/release-manifest.json" "$RUNNER_TEMP/existing-release/release-manifest.json"
            for archive in "$RUNNER_TEMP/release/"*.tgz; do
              cmp "$archive" "$RUNNER_TEMP/existing-release/$(basename "$archive")"
            done
          else
            gh release create "$RELEASE_TAG" --verify-tag \
              --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release/release-notes.md" \
              "$RUNNER_TEMP/release/"*.tgz "$RUNNER_TEMP/release/release-manifest.json"
          fi
